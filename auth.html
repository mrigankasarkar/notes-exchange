<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Notes Exchange</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Notes Exchange</h1>

        <a href="index.html" class="upload-button">
            Home
        </a>
    </header>


    <main class="upload-page">

        <h2>Login / Sign Up</h2>

        <form id="authForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Sign Up
            </button>

        </form>


        <p id="authMessage"></p>


        <p style="text-align: center; margin-top: 20px;">
            Already have an account?
            <button
                type="button"
                id="loginButton"
                style="background: none; border: none; color: #2563eb; cursor: pointer;"
            >
                Login
            </button>
        </p>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</body>

</html>
